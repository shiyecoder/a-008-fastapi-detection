      <stop offset="0%" stop-color="#0c2444"/>
      <stop offset="55%" stop-color="#081a32"/>
      <stop offset="100%" stop-color="#020a18"/>
    </radialGradient>
    <linearGradient id="topGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a5f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a3a5f" stop-opacity="0"/>
